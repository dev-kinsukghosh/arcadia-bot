<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcadiaMC Nation Currency Dashboard</title>
    <!-- Performance & Font Preconnections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="modulepreload" href="/src/entry-client.js" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0b0c10;
        color: #e2e8f0;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: 'Outfit', sans-serif;
      }
    </style>
    <!-- Instant synchronous maintenance precheck cache -->
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('maintenance_active') === 'true') {
            window.__INITIAL_MAINTENANCE__ = {
              active: true,
              reason: sessionStorage.getItem('maintenance_reason') || '',
            };
            window.__IS_MAINTENANCE__ = true;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="overflow-x-hidden bg-[#090a0f] text-slate-100 antialiased">
    <div id="app"></div>
    <script type="module" src="/src/entry-client.js"></script>
  </body>
</html>
