name: Deploy Arcadia Bot

on:
  push:
    branches:
      - main

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/arcadia-bot
  CONTAINER_NAME: arcadia-bot

jobs:
  # ── Step 1: Build & push image to GitHub Container Registry ────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── Step 2: SSH into server, pull & deploy ─────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            set -e

            # ── Authenticate with GHCR ──
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # ── Pull the latest image ──
            docker pull ${{ env.IMAGE_NAME }}:latest

            # ── Stop & remove old container (if running) ──
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            # ── Run new container with env vars ──
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -e DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}" \
              -e DISCORD_CLIENT_ID="${{ vars.DISCORD_CLIENT_ID }}" \
              -e DEV_ID="${{ vars.DEV_ID }}" \
              -e DB_IP="${{ secrets.DB_IP }}" \
              -e DB_PORT="${{ vars.DB_PORT }}" \
              -e DB_NAME="${{ vars.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
              -e REDIS_PORT="${{ vars.REDIS_PORT }}" \
              -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
              -e REDIS_DB="${{ vars.REDIS_DB }}" \
              -e LOG_LEVEL="${{ vars.LOG_LEVEL }}" \
              -e NODE_ENV=production \
              ${{ env.IMAGE_NAME }}:latest

            # ── Cleanup: remove old dangling images to free disk ──
            docker image prune -af --filter "until=24h"

            echo "✅ Arcadia Bot deployed successfully"

      - name: Verify container is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            sleep 5
            if docker ps --filter "name=${{ env.CONTAINER_NAME }}" --filter "status=running" | grep -q ${{ env.CONTAINER_NAME }}; then
              echo "✅ Container is running"
              docker logs --tail 20 ${{ env.CONTAINER_NAME }}
            else
              echo "❌ Container failed to start"
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi
