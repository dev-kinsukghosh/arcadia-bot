name: Deploy Dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Zip dist
        working-directory: dashboard
        run: |
          cd dist
          zip -qry ../../dashboard.zip .

      - name: Upload archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          source: "dashboard.zip"
          target: "/tmp"

      - name: Deploy dashboard
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            set -e

            TARGET="/www/wwwroot/arcc.webdevkin.com"
            TMP="/tmp/dashboard-deploy"

            mkdir -p "$TMP"
            rm -rf "$TMP"/*

            unzip -oq /tmp/dashboard.zip -d "$TMP"

            rsync -a --delete "$TMP"/ "$TARGET"/

            rm -rf "$TMP"
            rm -f /tmp/dashboard.zip

            chown -R www:www "$TARGET" 2>/dev/null || true

            echo "✅ Dashboard deployed successfully"